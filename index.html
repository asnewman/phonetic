<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phonetic</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/gh/asnewman/ashjs@v0.0.8/index.js"></script>
    <!-- <script src="ash.js"></script> -->
  </head>
  <body class="">
    <div id="ashjs"></div>
    <script type="text/javascript">
      const useDatabase = true;

      function getData() {
        if (useDatabase) {
          const baseId = localStorage.getItem("airtableBaseId");
          const tableId = localStorage.getItem("airtableTableId");
          const accessToken = localStorage.getItem("airtableAccessToken");

          if (!baseId || !tableId || !accessToken) {
            console.error("Airtable credentials not found in localStorage");
            return Promise.resolve([]);
          }

          return fetch(`https://api.airtable.com/v0/${baseId}/${tableId}`, {
            headers: {
              Authorization: `Bearer ${accessToken}`,
            },
          })
            .then((response) => {
              if (!response.ok) {
                throw new Error("Failed to fetch data from Airtable");
              }
              return response.json();
            })
            .then((data) => {
              return data.records.map((record) => ({
                id: record.id,
                native: record.fields.native,
                phonetic: record.fields.phonetic,
                english: record.fields.english,
                correctAttempts: record.fields.correctAttempts || 0,
                incorrectAttempts: record.fields.incorrectAttempts || 0,
              }));
            })
            .catch((error) => {
              console.error("Error fetching data from Airtable:", error);
              return [];
            });
        } else {
          return Promise.resolve([
            {
              id: 1,
              native: "こんにちは",
              phonetic: "konnichiwa",
              english: "Hello",
              correctAttempts: 0,
              incorrectAttempts: 0,
            },
            {
              id: 2,
              native: "ありがとう",
              phonetic: "Arigatou",
              english: "Thank you",
              correctAttempts: 0,
              incorrectAttempts: 0,
            },
          ]);
        }
      }

      function writeData(record) {
        if (useDatabase) {
          const baseId = localStorage.getItem("airtableBaseId");
          const tableId = localStorage.getItem("airtableTableId");
          const accessToken = localStorage.getItem("airtableAccessToken");

          if (!baseId || !tableId || !accessToken) {
            console.error("Airtable credentials not found in localStorage");
            return Promise.reject("Airtable credentials not found");
          }

          return fetch(`https://api.airtable.com/v0/${baseId}/${tableId}`, {
            method: "POST",
            headers: {
              Authorization: `Bearer ${accessToken}`,
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              fields: {
                native: record.native,
                phonetic: record.phonetic,
                english: record.english,
                correctAttempts: record.correctAttempts || 0,
                incorrectAttempts: record.incorrectAttempts || 0,
              },
            }),
          })
            .then((response) => {
              if (!response.ok) {
                throw new Error("Failed to write data to Airtable");
              }
              return response.json();
            })
            .then((data) => {
              console.log("Data successfully written to Airtable:", data);
              return data;
            })
            .catch((error) => {
              console.error("Error writing data to Airtable:", error);
              throw error;
            });
        } else {
          // If not using database, just return the record as if it was successfully added
          return Promise.resolve({
            id: Date.now(), // Generate a temporary ID
            fields: record,
          });
        }
      }

      function updateRecord(record) {
        if (useDatabase) {
          const baseId = localStorage.getItem("airtableBaseId");
          const tableId = localStorage.getItem("airtableTableId");
          const accessToken = localStorage.getItem("airtableAccessToken");

          if (!baseId || !tableId || !accessToken) {
            console.error("Airtable credentials not found in localStorage");
            return Promise.reject("Airtable credentials not found");
          }

          return fetch(
            `https://api.airtable.com/v0/${baseId}/${tableId}/${record.id}`,
            {
              method: "PATCH",
              headers: {
                Authorization: `Bearer ${accessToken}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                fields: {
                  correctAttempts: record.correctAttempts || 0,
                  incorrectAttempts: record.incorrectAttempts || 0,
                },
              }),
            }
          );
        } else {
          const recordIndex = store.data.findIndex(
            (item) => item.id === record.id
          );
          if (recordIndex !== -1) {
            store.data[recordIndex] = record;
          }
        }
      }

      async function indexRoute() {
        return `
          ${header()}
          -div(class="p-4 mb-16")
          --button(class="w-full border h-10 rounded-lg mb-2" onclick='go("config")')
          ---"Configuration"
          --input(id="search-text" type="text" placeholder="Search sentences..." class="w-full mt-2 px-3 py-2.5 text-sm rounded-sm border bg-[#ffffff] text-[#444444] focus:outline-[#aaaaaa] border-[#cccccc]" oninput="updateSearch")
          --div(id="sentences")
          { ${(store.filteredData || store.data).map((sentence) => sentenceCard(sentence.native, sentence.phonetic, sentence.english, sentence.correctAttempts, sentence.incorrectAttempts)).join("")} }
          -div(class="flex fixed bottom-0 w-full bg-white p-4 border")
          --button(class="flex-auto border h-10 rounded-lg mr-4" onclick='go("add")')
          ---"Add sentence"
          --button(class="flex-auto border h-10 rounded-lg mr-4" onclick='go("practice")')
          ---"Practice"
        `
      }

      async function addRoute() {
        return `
          ${header()}
          -div(class="p-4")
          --input(class="w-full mt-2 px-3 py-2.5 text-sm rounded-sm border bg-[#ffffff] text-[#444444] focus:outline-[#aaaaaa] border-[#cccccc]" type="text" placeholder="English" oninput="addInputUpdate")
          --input(class="w-full mt-2 px-3 py-2.5 text-sm rounded-sm border bg-[#ffffff] text-[#444444] focus:outline-[#aaaaaa] border-[#cccccc]" type="text" placeholder="Native" oninput="addInputUpdate")
          --input(class="w-full mt-2 px-3 py-2.5 text-sm rounded-sm border bg-[#ffffff] text-[#444444] focus:outline-[#aaaaaa] border-[#cccccc]" type="text" placeholder="Phonetic" oninput="addInputUpdate")
          --button(id="auto-generate-button" class="w-full mt-2 bg-blue-500 text-white p-3 rounded-lg shadow cursor-pointer disabled:bg-gray-400 disabled:cursor-not-allowed" ${isAutoGenerateButtonDisabled() || store.generating ? `disabled="true"` : ""} onclick="autoGenerate")
          ---"Auto-generate"
          --button(id="add-button" class="w-full mt-2 bg-black text-white p-3 rounded-lg shadow cursor-pointer disabled:bg-gray-400" onclick="add" ${isAddButtonDisabled() ? `disabled="true"` : ""})
          ---"Add"
        `
      }

      async function practiceRoute(emit) {
        if (store.practiceSession.current === null) {
          startNewPracticeSession(store);
        }

        const totalAttempts =
          store.practiceSession.current.correctAttempts +
          store.practiceSession.current.incorrectAttempts;
        const score =
          totalAttempts > 0
            ? Math.round(
                (store.practiceSession.current.correctAttempts / totalAttempts) * 100
              )
            : 0;

        let hintColor = "text-gray-400";

        if (store.hintProgress.status === "correct") {
          hintColor = "text-green-500";
        } else if (store.hintProgress.status === "partial") {
          hintColor = "text-gray-400";
        } else if (store.hintProgress.status === "incorrect") {
          hintColor = "text-red-500";
        }

        const dontKnowHintP = [];
        if (store.hintProgress.status === "partial") {
          dontKnowHintP.push(`
            -span(class="text-yellow-500")
            --"${store.practiceSession.current.phonetic.slice(0, store.hintProgress.to)}"
          `);
        }
        dontKnowHintP.push(`
          -span(class="${hintColor}")
          --"${store.practiceSession.current.phonetic.slice(
            store.hintProgress.to,
            store.hintProgress.length)}"
        `);


        return `
          ${header(store)}
          -div(class="p-4")
          --p(class="text-lg font-bold mb-4")
          ---"Translate this sentence:"
          --p(class="text-xl")
          ---"${store.practiceSession.current.english}"
          --p(id="dont-know-hint" class="${`text-sm ${hintColor} font-bold ${
                  store.dontKnowHintVisible ? "block" : "hidden"
                }`}") 
          {${dontKnowHintP.join("")}}
          --input(type="text" placeholder="Type the translation..." class="w-full mt-6 px-3 py-2.5 text-sm rounded-sm border bg-[#ffffff] text-[#444444] focus:outline-[#aaaaaa] border-[#cccccc]" oninput="onPracticeType")
          --button(id="check-button" class="w-full mt-4 bg-blue-500 text-white p-3 rounded-lg shadow cursor-pointer disabled:bg-gray-400" onclick="check")
          ---"${store.dontKnowHintVisible ? "Next" : "Check"}"
          --button(class="w-full mt-2 bg-gray-500 text-white p-3 rounded-lg shadow cursor-pointer" onclick="dontKnow")
          ---"I don't know"
          --div(id="toast-container" class="fixed top-4 right-4 z-50")
          ${store.toast.message ? `
            ---p(class="${store.toast.class}")
            ----"${store.toast.message}"
          ` : ""}
          --div(class="mt-4 flex flex-col items-center space-y-2")
          ---p(class="text-blue-500 font-bold text-lg")
          ----"Score for this sentence: ${score}%"
          ---p(class="text-green-500 font-bold")
          ----"Correct attempts: ${store.practiceSession.current.correctAttempts}"
          ---p(class="text-red-500 font-bold")
          ----"Incorrect attempts: ${store.practiceSession.current.incorrectAttempts}"
        `

        return [
          header(store),
          {
            div: [
              {
                p: "Translate this sentence:",
                class: "text-lg font-bold mb-4",
              },
              {
                p: store.practiceSession.current.english,
                class: "text-xl",
              },
              {
                p: dontKnowHintP,
                id: "dont-know-hint",
                class: `text-sm ${hintColor} font-bold ${
                  store.dontKnowHintVisible ? "block" : "hidden"
                }`,
              },
              {
                input: [],
                type: "text",
                placeholder: "Type the translation...",
                class:
                  "w-full mt-6 px-3 py-2.5 text-sm rounded-sm border bg-[#ffffff] text-[#444444] focus:outline-[#aaaaaa] border-[#cccccc]",
                oninput: (e) => {
                  emit("render-ids", ["check-button"]);
                  emit("check-hint");
                },
              },
              {
                button: store.dontKnowHintVisible ? "Next" : "Check",
                id: "check-button",
                ...(store.loadingNextPracticeSentence ? { disabled: "" } : {}),
                class:
                  "w-full mt-4 bg-blue-500 text-white p-3 rounded-lg shadow cursor-pointer disabled:bg-gray-400",
                onclick: () => {
                  emit("check");
                },
              },
              {
                button: "I don't know",
                class:
                  "w-full mt-2 bg-gray-500 text-white p-3 rounded-lg shadow cursor-pointer",
                onclick: () => {
                  emit("dont-know");
                },
              },
              {
                div: [
                  store.toast.message
                    ? {
                        p: store.toast.message,
                        class: store.toast.class,
                      }
                    : { div: "" },
                ],
                id: "toast-container",
                class: "fixed top-4 right-4 z-50",
              },
              {
                div: [
                  {
                    p: `Score for this sentence: ${score}%`,
                    class: "text-blue-500 font-bold text-lg",
                  },
                  {
                    p: `Correct attempts: ${store.practiceSession.current.correctAttempts}`,
                    class: "text-green-500 font-bold",
                  },
                  {
                    p: `Incorrect attempts: ${store.practiceSession.current.incorrectAttempts}`,
                    class: "text-red-500 font-bold",
                  },
                ],
                class: "mt-4 flex flex-col items-center space-y-2",
              },
            ],
            class: "p-4",
          },
        ];
      }

      async function configRoute(emit) {
        return `
          ${header(store)}
          -div(id="toast-container" class="fixed top-4 right-4 z-50")
          ${store.toast.message ? `
            --p(class="${store.toast.class}")
            ---"${store.toast.message}"
          ` : ""}
          -div(class="p-4")
          --h1(class="text-lg font-bold mb-2")
          ---"Language"
          --input(type="text" placeholder="Language" value="${localStorage.getItem("language") || ""}" id="language" class="w-full mt-2 mb-4 px-3 py-2.5 text-sm rounded-sm border bg-[#ffffff] text-[#444444] focus:outline-[#aaaaaa] border-[#cccccc]")
          --h1(class="text-lg font-bold mb-2")
          ---"Configure Airtable Connection"
          --input(type="text" placeholder="Airtable Base ID" value="${localStorage.getItem("airtableBaseId") || ""}" id="language" class="w-full mt-2 px-3 py-2.5 text-sm rounded-sm border bg-[#ffffff] text-[#444444] focus:outline-[#aaaaaa] border-[#cccccc]" id="baseId")
          --input(type="text" placeholder="Airtable Table ID" value="${localStorage.getItem("airtableTableId") || ""}" id="language" class="w-full mt-2 px-3 py-2.5 text-sm rounded-sm border bg-[#ffffff] text-[#444444] focus:outline-[#aaaaaa] border-[#cccccc]" id="tableId")
          --input(type="text" placeholder="Airtable Access Token" value="${localStorage.getItem("airtableAccessToken") || ""}" id="language" class="w-full mt-2 px-3 py-2.5 text-sm rounded-sm border bg-[#ffffff] text-[#444444] focus:outline-[#aaaaaa] border-[#cccccc]" id="accessToken")
          --button(class="w-full mt-4 bg-black text-white p-3 rounded-lg shadow cursor-pointer" onclick="saveConfig")
          ---"Save Configuration"
        `
      }

      function startNewPracticeSession(store) {
        const orderedSentences = store.data.sort(
          (a, b) => {
            if (b.correctAttempts === 0 && b.incorrectAttempts === 0) return 1;
            if (a.correctAttempts === 0 && a.incorrectAttempts === 0) return -1;

            const aScore = a.correctAttempts / (a.correctAttempts + a.incorrectAttempts);
            const bScore = b.correctAttempts / (b.correctAttempts + b.incorrectAttempts);
            return aScore - bScore;
          }
        );
        const current = orderedSentences.shift();
        store.practiceSession = {
          toPractice: orderedSentences,
          practiced: [],
          current,
        };
      }

      function isAutoGenerateButtonDisabled() {
        const english = document.querySelector(
          'input[placeholder="English"]'
        )?.value;
        return !Boolean(english);
      }

      function isAddButtonDisabled() {
        const native = document.querySelector(
          'input[placeholder="Native"]'
        )?.value;
        const phonetic = document.querySelector(
          'input[placeholder="Phonetic"]'
        )?.value;
        const english = document.querySelector(
          'input[placeholder="English"]'
        )?.value;

        return !native || !phonetic || !english;
      }

      function header() {
        return `
          -div(class="bg-black text-white p-4 cursor-pointer" onclick="go-home")
          --h2(class="text-xl font-bold")
          ---"Phonetic"
        `

        return {
          div: [{ h1: "Phonetic", class: "text-xl font-bold" }],
          class: "bg-black text-white p-4 cursor-pointer",
          onclick: () => {
            window.location.hash = "";
            store.practiceSession.current = null;
            store.practiceSession.practiced = [];
            store.practiceSession.toPractice = [];
          },
        };
      }

      function sentenceCard(
        native,
        phonetic,
        english,
        correctAttempts,
        incorrectAttempts
      ) {
        const percentage = Math.round(
          (correctAttempts / (correctAttempts + incorrectAttempts)) * 100
        );
        const scoreText = Number.isInteger(percentage)
          ? `Score: ${percentage}%`
          : "";

        const totalAttempts = correctAttempts + incorrectAttempts;

        return `
          -div(class="mt-4 bg-card text-card-foreground p-3 rounded-lg shadow cursor-pointer relative")
          --p(class="text-lg font-bold")
          ---"${native}"
          --p(class="text-sm text-muted-foreground")
          ---"${phonetic}"
          --p(class="text-sm")
          ---"${english}"
          --p(class="text-blue-500 font-bold text-sm absolute bottom-3 right-4")
          ---"${scoreText}"
        `
      }

      /**
       * Displays a toast notification and automatically hides it after a set duration.
       *
       * @param {Object} store - The application's store object.
       * @param {string} message - The message to display in the toast.
       * @param {string} type - The type of toast, either "success" or "error".
       * @param {Function} render - The function to call to re-render the component.
       */
      function showToast(store, message, type, render) {
        store.toast.message = message;
        store.toast.class = `p-4 rounded-lg shadow-lg ${
          type === "success" ? "bg-green-500" : "bg-red-500"
        } text-white mb-2`;
        render("toast-container");

        setTimeout(() => {
          store.toast.class = "opacity-0 transition-opacity duration-300";
          render("toast-container");
          setTimeout(() => {
            store.toast.message = null;
            store.toast.class = null;
            render("toast-container");
          }, 300);
        }, 5000);
      }

      const routes = {
        "/": indexRoute,
        "/add": addRoute,
        "/practice": practiceRoute,
        "/config": configRoute,
      };

      const events = {
        "updateSearch": (data, render) => {
          const searchText = document.getElementById("search-text").value

          if (!searchText) {
            store.filteredData = null;
          } else {
            const filteredData = store.data.filter(
              (sentence) =>
                sentence.native
                  .toLowerCase()
                  .includes(searchText.toLowerCase()) ||
                sentence.english
                  .toLowerCase()
                  .includes(searchText.toLowerCase()) ||
                sentence.phonetic
                  .toLowerCase()
                  .includes(searchText.toLowerCase())
            );
            store.filteredData = filteredData;
          }

          render("sentences");
        },
        "autoGenerate": async (data, render) => {
          const englishInput = document.querySelector(
            'input[placeholder="English"]'
          );
          const nativeInput = document.querySelector(
            'input[placeholder="Native"]'
          );
          const phoneticInput = document.querySelector(
            'input[placeholder="Phonetic"]'
          );

          if (englishInput.value) {
            try {
              store.generating = true;
              render("auto-generate-button");
              const response = await fetch(
                "https://asnewman-translate.web.val.run",
                {
                  method: "POST",
                  body: JSON.stringify({
                    language: localStorage.getItem("language") || "",
                    english: englishInput.value,
                  }),
                }
              );

              if (response.ok) {
                const data = await response.json();
                nativeInput.value = data.native;
                phoneticInput.value = data.phonetic;
                render("add-button");
              } else {
                console.error("Error generating translation");
              }
            } catch (error) {
              console.error("Error:", error);
            } finally {
              store.generating = false;
              render("auto-generate-button");
            }
          }
        },
        add: (data, render) => {
          const native = document.querySelector(
            'input[placeholder="Native"]'
          ).value;
          const phonetic = document.querySelector(
            'input[placeholder="Phonetic"]'
          ).value;
          const english = document.querySelector(
            'input[placeholder="English"]'
          ).value;

          writeData(
            {
              native,
              phonetic,
              english,
              correctAttempts: 0,
              incorrectAttempts: 0,
            },
            true
          ) // Set to true to use the database
            .then((newRecord) => {
              store.data.push({
                id: newRecord.id,
                ...newRecord.fields,
              });
              window.location.hash = "";
            })
            .catch((error) => {
              console.error("Failed to add new sentence:", error);
              // Handle the error (e.g., show an error message to the user)
            });
        },
        addInputUpdate: (_, render) => {
          render('auto-generate-button')
          render('add-button')
        },
        "renderIds": (rawData, render) => {
          const quotesReplaced = rawData.replaceAll("'", "\"")
          const data = JSON.parse(quotesReplaced)
          data.forEach((id) => {
            render(id);
          });
        },
        onPracticeType: (_, render, emit) => {
          render("check-button");
          emit("checkHint");
        },
        check: async (data, render) => {
          store.loadingNextPracticeSentence = true;
          render("check-button");
          if (store.dontKnowHintVisible) {
            store.dontKnowHintVisible = false;
            store.hintProgress = {
              status: null,
              from: null,
              to: null,
            };
            store.practiceSession.toPractice.push(store.practiceSession.current);
            store.practiceSession.current = store.practiceSession.toPractice.shift();
          } else {
            const userInput = document
              .querySelector('input[placeholder="Type the translation..."]')
              .value.trim()
              .toLowerCase();
            const correctAnswer = store.practiceSession.current.phonetic.toLowerCase();

            if (userInput === correctAnswer) {
              showToast(store, "Correct! Well done!", "success", render);
              await updateRecord(
                {
                  ...store.practiceSession.current,
                  correctAttempts: store.practiceSession.current.correctAttempts + 1,
                },
                true
              );
              store.practiceSession.practiced.push(store.practiceSession.current);
              store.practiceSession.current = store.practiceSession.toPractice.shift();
            } else {
              await updateRecord(
                {
                  ...store.practiceSession.current,
                  incorrectAttempts: store.practiceSession.current.incorrectAttempts + 1,
                },
                true
              );
              showToast(
                store,
                `Incorrect. The correct answer is: ${store.practiceSession.current.phonetic}`,
                "error",
                render
              );
              store.practiceSession.toPractice.push(store.practiceSession.current);
              store.practiceSession.current = store.practiceSession.toPractice.shift();
            }
          }

          store.loadingNextPracticeSentence = false;
          render();
        },
        "saveConfig": (data, render, emit) => {
          localStorage.setItem(
            "language",
            document.getElementById("language").value
          );
          localStorage.setItem(
            "airtableBaseId",
            document.getElementById("baseId").value
          );
          localStorage.setItem(
            "airtableTableId",
            document.getElementById("tableId").value
          );
          localStorage.setItem(
            "airtableAccessToken",
            document.getElementById("accessToken").value
          );
          showToast(
            store,
            "Configuration saved successfully!",
            "success",
            render
          );
          emit("refreshData");
        },
        "dontKnow": (data, render) => {
          store.dontKnowHintVisible = true;
          render("dont-know-hint");
        },
        "checkHint": (data, render) => {
          if (store.dontKnowHintVisible === false) {
            return;
          }

          // highlight hint based on user input
          // if user input is correct, highlight the hint in green
          // if user input is incorrect, highlight the hint in red
          // if user input is partially correct, highlight the hint in yellow
          const input = document.querySelector(
            'input[placeholder="Type the translation..."]'
          );
          const hintElement = document.getElementById("dont-know-hint");
          const hint = store.practiceSession.current.phonetic.toLowerCase();
          const inputText = input.value.trim().toLowerCase();

          if (inputText === hint) {
            store.hintProgress = {
              status: "correct",
            };
          } else if (hint.includes(inputText)) {
            hintElement.style.color = "yellow";
            store.hintProgress = {
              status: "partial",
              // set "to" to the index of the last character in inputText
              to: inputText.length,
            };
          } else {
            hintElement.style.color = "red";
            store.hintProgress = {
              status: "incorrect",
            };
          }

          render("dont-know-hint");
        },
        "refreshData": (data, render) => {
          getData(true).then((data) => {
            store.data = data;
            render();
          });
        },
        "go-home": (data, render) => {
          window.location.hash = "";
          store.practiceSession.current = null;
          store.practiceSession.practiced = [];
          store.practiceSession.toPractice = [];
        }
      };

      let store = {};

      getData(true).then((data) => {
        store = {
          data: data,
          filteredData: null,
          generating: false,
          practiceSession: {
            toPractice: [],
            practiced: [],
            current: null,
          },
          toast: {
            message: null,
            class: null,
          },
          dontKnowHintVisible: false,
          hintProgress: {
            status: null,
